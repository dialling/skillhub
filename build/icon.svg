<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18213a"/>
      <stop offset="0.55" stop-color="#0b101c"/>
      <stop offset="1" stop-color="#06080f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.34" r="0.62">
      <stop offset="0" stop-color="#2f81f7" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#2f81f7" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#2f81f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="iri" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.48" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="core" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#bfe4ff"/>
      <stop offset="0.45" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#7c4dff"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <!-- macOS-style squircle plate -->
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="230" fill="url(#glow)"/>

  <!-- hexagon: the SKILL.md package -->
  <polygon points="512,262 728.5,387 728.5,637 512,762 295.5,637 295.5,387"
           fill="none" stroke="url(#iri)" stroke-width="46" stroke-linejoin="round"/>

  <!-- spokes to alternating vertices: one hub, many agents -->
  <g stroke="url(#iri)" stroke-width="40" stroke-linecap="round" opacity="0.92">
    <path d="M512 512 L512 300"/>
    <path d="M512 512 L696 618"/>
    <path d="M512 512 L328 618"/>
  </g>

  <!-- satellite nodes -->
  <g fill="#0b101c" stroke="url(#iri)" stroke-width="34">
    <circle cx="512" cy="290" r="62"/>
    <circle cx="704" cy="622" r="62"/>
    <circle cx="320" cy="622" r="62"/>
  </g>

  <!-- glowing hub -->
  <circle cx="512" cy="512" r="128" fill="#2f81f7" opacity="0.5" filter="url(#soft)"/>
  <circle cx="512" cy="512" r="104" fill="url(#core)"/>
</svg>
