name: Refresh shared star data

# Turns the repository into the shared data source the app refreshes from, so
# no server is needed. Every client reads these files through a CDN; without
# this job a fresh install has no star history to compute a leaderboard from.
on:
  schedule:
    # Twice a day: GitHub's cron is best-effort and can be delayed by a lot
    # under load, so a second attempt makes "daily" actually mean daily.
    - cron: '17 2 * * *'
    - cron: '17 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch star counts and merge history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-live-data.mjs

      # Pulls the individual skills out of the catalog's repositories: sparse
      # clones each one, reads every SKILL.md frontmatter, and writes per-category
      # shards. ~10 minutes for 40 repositories; no API budget is used because
      # sparse checkout fetches blobs over the git protocol rather than the API.
      - name: Extract the skills inside the repositories
        run: node scripts/extract-skills.mjs

      - name: Commit when something changed
        run: |
          git config user.name  "skillhub-data"
          git config user.email "skillhub-data@users.noreply.github.com"
          git add data/live
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
            exit 0
          fi
          git commit -m "data: refresh star counts, history and skill index ($(date -u +%Y-%m-%d))"
          git push
